name: Publish helper
on:
  push:
    tags: ['v5.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test && npm run build
      - run: python3 tests/helper_test.py && python3 scripts/package-helper.py
      - run: gh release create "$GITHUB_REF_NAME" .internal/Network-Status-Helper-macOS.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
